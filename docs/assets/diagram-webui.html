<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>log-triage · Web UI architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#07151a; --ink:#d2e2dd; --muted:#90a8a3; --soft:#5f7873; --accent:#2dd4bf; --link:#5aa9ff; --focal:#ff6bb0;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Web UI architecture · log-triage</p>
    <h1>Routers read one reload-safe STATE</h1>
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(210,226,221,0.10)"/></pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#90a8a3"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2dd4bf"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5aa9ff"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#07151a"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- arrows -->
      <line x1="160" y1="96" x2="212" y2="96" stroke="#5aa9ff" stroke-width="1.2" marker-end="url(#arrow-link)"/>   <!-- request -> middleware -->
      <line x1="372" y1="96" x2="424" y2="96" stroke="#90a8a3" stroke-width="1.2" marker-end="url(#arrow)"/>        <!-- middleware -> include_router -->
      <!-- app assembler -> routers -->
      <line x1="508" y1="120" x2="508" y2="172" stroke="#90a8a3" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- routers -> STATE (read) -->
      <line x1="508" y1="252" x2="508" y2="306" stroke="#2dd4bf" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- config_io -> STATE (mutate in place) -->
      <line x1="792" y1="338" x2="600" y2="338" stroke="#2dd4bf" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- labels -->
      <rect x="116" y="76" width="48" height="12" rx="2" fill="#07151a"/><text x="140" y="86" fill="#5aa9ff" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>
      <rect x="320" y="76" width="52" height="12" rx="2" fill="#07151a"/><text x="346" y="86" fill="#90a8a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CSRF/IP</text>
      <rect x="460" y="300" width="96" height="12" rx="2" fill="#07151a"/><text x="508" y="310" fill="#2dd4bf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ AT CALL-TIME</text>
      <rect x="640" y="318" width="120" height="12" rx="2" fill="#07151a"/><text x="700" y="328" fill="#2dd4bf" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MUTATE IN PLACE</text>

      <!-- Request -->
      <rect x="32" y="64" width="128" height="64" rx="6" fill="#07151a"/>
      <rect x="32" y="64" width="128" height="64" rx="6" fill="rgba(144,168,163,0.10)" stroke="#5f7873" stroke-width="1"/>
      <rect x="40" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(95,120,115,0.50)" stroke-width="0.8"/>
      <text x="54" y="81" fill="#90a8a3" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQ</text>
      <text x="96" y="100" fill="#d2e2dd" font-size="12" font-weight="600" text-anchor="middle">Request</text>
      <text x="96" y="116" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser</text>

      <!-- Middleware -->
      <rect x="212" y="64" width="160" height="64" rx="6" fill="#07151a"/>
      <rect x="212" y="64" width="160" height="64" rx="6" fill="rgba(45,212,191,0.05)" stroke="rgba(45,212,191,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="220" y="72" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,212,191,0.40)" stroke-width="0.8"/>
      <text x="250" y="81" fill="#2dd4bf" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUARD</text>
      <text x="292" y="100" fill="#d2e2dd" font-size="12" font-weight="600" text-anchor="middle">Middleware</text>
      <text x="292" y="116" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">session · CSRF · IPs</text>

      <!-- app.py assembler (focal) -->
      <rect x="424" y="64" width="168" height="64" rx="6" fill="#07151a"/>
      <rect x="424" y="64" width="168" height="64" rx="6" fill="rgba(45,212,191,0.12)" stroke="#2dd4bf" stroke-width="1"/>
      <rect x="432" y="72" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,212,191,0.50)" stroke-width="0.8"/>
      <text x="458" y="81" fill="#2dd4bf" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP.PY</text>
      <text x="508" y="100" fill="#d2e2dd" font-size="12" font-weight="600" text-anchor="middle">Assembler</text>
      <text x="508" y="116" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">include_router()</text>

      <!-- Routers (the 9) -->
      <rect x="356" y="172" width="304" height="80" rx="6" fill="#07151a"/>
      <rect x="356" y="172" width="304" height="80" rx="6" fill="#102931" stroke="#d2e2dd" stroke-width="1"/>
      <rect x="364" y="180" width="60" height="12" rx="2" fill="transparent" stroke="rgba(210,226,221,0.40)" stroke-width="0.8"/>
      <text x="394" y="189" fill="#d2e2dd" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTERS</text>
      <text x="508" y="212" fill="#d2e2dd" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">auth · issues · logs · regex</text>
      <text x="508" y="230" fill="#d2e2dd" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">dashboard · config · rag · llm · system</text>
      <text x="508" y="246" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never import app</text>

      <!-- STATE (focal hub) -->
      <rect x="356" y="306" width="244" height="64" rx="6" fill="#07151a"/>
      <rect x="356" y="306" width="244" height="64" rx="6" fill="rgba(255,107,176,0.15)" stroke="#ff6bb0" stroke-width="1"/>
      <rect x="364" y="314" width="44" height="12" rx="2" fill="transparent" stroke="rgba(255,107,176,0.55)" stroke-width="0.8"/>
      <text x="386" y="323" fill="#ff6bb0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="478" y="342" fill="#d2e2dd" font-size="12" font-weight="600" text-anchor="middle">STATE singleton</text>
      <text x="478" y="358" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">settings · llm · rag — never rebound</text>

      <!-- config_io -->
      <rect x="792" y="306" width="160" height="64" rx="6" fill="#07151a"/>
      <rect x="792" y="306" width="160" height="64" rx="6" fill="#102931" stroke="#d2e2dd" stroke-width="1"/>
      <rect x="800" y="314" width="56" height="12" rx="2" fill="transparent" stroke="rgba(210,226,221,0.40)" stroke-width="0.8"/>
      <text x="828" y="323" fill="#d2e2dd" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELOAD</text>
      <text x="872" y="342" fill="#d2e2dd" font-size="12" font-weight="600" text-anchor="middle">config_io</text>
      <text x="872" y="358" fill="#90a8a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">re-parse → STATE</text>

      <!-- Legend -->
      <line x1="32" y1="392" x2="968" y2="392" stroke="rgba(210,226,221,0.10)" stroke-width="0.8"/>
      <text x="32" y="408" fill="#90a8a3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="124" y="400" width="14" height="10" rx="2" fill="rgba(255,107,176,0.15)" stroke="#ff6bb0" stroke-width="1"/>
      <text x="144" y="408" fill="#90a8a3" font-size="8.5">Single source of truth</text>
      <rect x="320" y="400" width="14" height="10" rx="2" fill="#102931" stroke="#d2e2dd" stroke-width="1"/>
      <text x="340" y="408" fill="#90a8a3" font-size="8.5">Module</text>
      <rect x="430" y="400" width="14" height="10" rx="2" fill="rgba(45,212,191,0.05)" stroke="rgba(45,212,191,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="450" y="408" fill="#90a8a3" font-size="8.5">Guard / boundary</text>
      <line x1="612" y1="405" x2="640" y2="405" stroke="#2dd4bf" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="648" y="408" fill="#90a8a3" font-size="8.5">STATE access</text>
    </svg>
  </div>
</body>
</html>
